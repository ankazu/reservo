name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reservo_app
          POSTGRES_PASSWORD: reservo_ci_password
          POSTGRES_DB: reservo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservo_app -d reservo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://reservo_app:reservo_ci_password@localhost:5432/reservo
      RESERVATION_MAINTENANCE_SECRET: ci-only-maintenance-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Check migration metadata
        run: npm run db:check

      - name: Apply migrations to empty PostgreSQL
        run: npm run db:migrate

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Build production application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify production artifact with Playwright
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_PRODUCTION: 'true'
