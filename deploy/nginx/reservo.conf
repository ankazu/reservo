# Reference reverse-proxy configuration for the production Node server.
# Include the limit_req_zone directives in nginx's http context and the
# location blocks in the HTTPS server that fronts Reservo.

limit_req_zone $binary_remote_addr zone=reservo_availability:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=reservo_lookup:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=reservo_hold:10m rate=1r/m;

upstream reservo_node {
  server 127.0.0.1:3000;
}

server {
  listen 443 ssl;
  server_name reservations.example.com;
  limit_req_status 429;
  error_page 429 = @rate_limited;

  # TLS certificate directives belong to the hosting environment.

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Overwrite rather than append so public clients cannot spoof their IP.
  proxy_set_header X-Forwarded-For $remote_addr;

  location = /api/availability {
    limit_req zone=reservo_availability burst=10 nodelay;
    proxy_pass http://reservo_node;
  }

  location = /api/reservations {
    limit_req zone=reservo_hold burst=2 nodelay;
    proxy_pass http://reservo_node;
  }

  location ~ ^/api/reservations/[0-9a-fA-F-]+$ {
    limit_req zone=reservo_lookup burst=5 nodelay;
    proxy_pass http://reservo_node;
  }

  location / {
    proxy_pass http://reservo_node;
  }

  location @rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"RATE_LIMITED"}}';
  }
}
